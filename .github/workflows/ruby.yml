name: Build

#プルリクエスト作成時に実行(他にもpush時など設定できます)
on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: rails8-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  # setup-ruby / setup-node が bundler・pnpm キャッシュを保存・復元する
  actions: write
  packages: read

jobs:
  rspec-job:
    #ubuntu環境で動かします
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      RAILS_ENV: test
      OPENSEARCH_URL: http://127.0.0.1:9200

    services:
      mysql:
        image: mysql:26.10
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
      # OpenSearch は services: ではなく steps 内で起動する。
      # searchkick language: 'japanese' が analysis-kuromoji を要求するため、
      # 素の公式イメージは使わない。イメージは opensearch-image.yml が
      # devenv/opensearch/Dockerfile から GHCR に push したものを pull する。

    # https://github.com/ruby/setup-ruby
    steps:
      - uses: Kesin11/actions-timeline@v3.2.1
        with:
          # github-token: ${{ secrets.GITHUB_TOKEN }}
          show-waiting-runner: true
      - name: checkout
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v7
      - name: checkout pr
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # OpenSearch は起動に数十秒かかる。先にコンテナを立ち上げ、
      # gem / apt / assets と起動待ちを重ねる。
      - name: Configure sysctl limits
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144
      - name: Run OpenSearch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(sha256sum devenv/opensearch/Dockerfile | awk '{print substr($1,1,12)}')
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rails8-opensearch:${tag}"
          echo "OpenSearch image: ${image}"
          if ! docker pull "${image}"; then
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin || true
            docker pull "${image}" || true
          fi
          if ! docker image inspect "${image}" >/dev/null 2>&1; then
            echo "Prebuilt image is not on GHCR. Building devenv/opensearch/Dockerfile"
            docker build -t "${image}" devenv/opensearch
          fi
          docker run -d --name opensearch -p 9200:9200 \
            -e discovery.type=single-node \
            -e DISABLE_SECURITY_PLUGIN=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true \
            -e OPENSEARCH_JAVA_OPTS='-Xms512m -Xmx512m' \
            --ulimit memlock=-1:-1 \
            "${image}"
      # bundler キャッシュは cache-warmup.yml が main に保存する。
      # Gemfile.lock が違っても restore-keys で部分復元される。
      - name: Setup Ruby version
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .tool-versions
          bundler-cache: true
      # libmysqlclient-dev は ubuntu-latest に導入済みで、このステップは no-op だった。
      # libvips42 は ruby-vips（Gemfile で常時 require）が起動時に要る。
      - name: Install dependent libraries
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libvips42
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Setup node env 🧱
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache: 'pnpm'
      - name: Install dependencies 👨🏻‍💻
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: pnpm build
        run: bundle exec rails assets:precompile

      - name: Setup Database
        run: |
          cp config/database.yml.github-actions config/database.yml
          bundle exec rake db:create
          bundle exec rake db:migrate

      - name: Run Brakeman
        run: bundle exec brakeman

      - name: Verify OpenSearch connection from host
        run: |
          echo "${OPENSEARCH_URL}"
          for i in $(seq 1 30); do
            if curl -fsSL "${OPENSEARCH_URL}/_cat/health?h=status"; then
              exit 0
            fi
            echo "waiting for OpenSearch... (${i}/30)"
            sleep 5
          done
          echo "OpenSearch did not become available"
          docker logs opensearch
          exit 1
      # searchkick language: 'japanese' が kuromoji を要求するため、
      # 存在しなければここで落として原因を特定しやすくする
      - name: Verify OpenSearch plugins
        run: |
          plugins=$(curl -fsSL "${OPENSEARCH_URL}/_cat/plugins?h=component" | sort)
          echo "${plugins}"
          echo "${plugins}" | grep -q analysis-kuromoji
          echo "${plugins}" | grep -q analysis-icu

      - name: Run RSpec
        run: |
          bundle exec rspec

      - name: Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage # このディレクトリに、テスティングツールによるカバレッジレポートファイルが出力される想定
